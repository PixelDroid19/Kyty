name: Build and Release

on:
  push:
    tags: ["v*"]
  # Pull requests build both packages so a Windows-only break shows before a release.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyty-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-loader
            mingw-w64-x86_64-spirv-headers
            mingw-w64-x86_64-spirv-tools
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-tools

      - name: Configure
        shell: msys2 {0}
        run: >-
          cmake -S source -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DKYTY_PROJECT_NAME=Emulator
          -DKYTY_WARNINGS_ARE_ERRORS=OFF
          -DKYTY_BUILD_LAUNCHER=ON
          -DKYTY_BUILD_DEVTOOLS=OFF
          -DKYTY_BUILD_UNIT_TESTS=OFF
          -DKYTY_GENERATE_MAP_CSV=OFF

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --target fc_script launcher --parallel 4

      # Installing only the launcher directory runs windeployqt without the vendored libraries' install rules.
      - name: Stage launcher
        shell: msys2 {0}
        run: cmake --install build/launcher --prefix dist

      - name: Stage archive
        shell: pwsh
        run: |
          Copy-Item build/fc_script.exe dist/
          Copy-Item scripts/run_guest.lua,README.md,CHANGELOG.md,LICENSE dist/

      # windeployqt copies Qt itself; the MinGW runtime, the shader toolchain and Qt's own dependencies
      # (ICU, HarfBuzz, zstd, ...) come from MSYS2. Import tables are read rather than running ldd, which
      # starts each binary and missed the emulator's own imports. objdump is a native Windows tool, so its
      # lines end in CRLF.
      - name: Stage MSYS2 runtime libraries
        shell: msys2 {0}
        run: |
          set -euo pipefail
          pending="$(find dist -name '*.exe' -o -name '*.dll')"
          while [ -n "$pending" ]; do
            added=""
            for binary in $pending; do
              for library in $(objdump -p "$binary" | tr -d '\r' | awk '/DLL Name:/ { print $3 }'); do
                if [ -f "/mingw64/bin/$library" ] && [ ! -f "dist/$library" ]; then
                  cp "/mingw64/bin/$library" dist/
                  echo "bundled $library"
                  added="$added dist/$library"
                fi
              done
            done
            pending="$added"
          done
          # Every import must now be in the package or in System32; API sets have no file of their own.
          unresolved=""
          for binary in $(find dist -name '*.exe' -o -name '*.dll'); do
            for library in $(objdump -p "$binary" | tr -d '\r' | awk '/DLL Name:/ { print $3 }'); do
              case "$library" in api-ms-win-*|ext-ms-*) continue ;; esac
              [ -f "dist/$library" ] || [ -f "/c/Windows/System32/$library" ] || unresolved="$unresolved $binary:$library"
            done
          done
          if [ -n "$unresolved" ]; then echo "unresolved imports:$unresolved"; exit 1; fi
          test -f dist/launcher.exe && test -f dist/Qt6Quick.dll && test -f dist/platforms/qwindows.dll

      # With only the system directories on PATH, nothing but the package provides the DLLs, so a missing one
      # stops the emulator here.
      - name: Check the emulator starts from the package
        shell: pwsh
        working-directory: dist
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $usage = & ./fc_script.exe | Out-String
          if ($usage -notmatch 'fc_script <lua_script>') { throw "fc_script.exe did not start (exit code $LASTEXITCODE)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kyty-windows-x64-${{ github.sha }}
          path: dist
          if-no-files-found: error

  build-linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev libgl-dev libegl-dev libxkbcommon-dev

      - name: Build Vulkan 1.4 SDK components
        uses: humbletim/setup-vulkan-sdk@c25f41106918cde0bf347e6f201277392b3a9e9d # v1.2.1
        with:
          vulkan-query-version: 1.4.357.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader, SPIRV-Headers, SPIRV-Tools
          vulkan-use-cache: true

      # The official Qt binaries are relocatable, so the package can carry them; the launcher dev shell pins the same version.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.2
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Build package
        run: |
          package="kyty-${GITHUB_REF_NAME//\//-}-linux-x64"
          CMAKE_PREFIX_PATH="$QT_ROOT_DIR" scripts/package_linux.sh build "dist/${package}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kyty-linux-x64-${{ github.sha }}
          path: dist
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          win_dir="$(find artifacts -maxdepth 1 -type d -name 'kyty-windows-x64-*' -print -quit)"
          linux_dir="$(find artifacts -maxdepth 1 -type d -name 'kyty-linux-x64-*' -print -quit)"
          test -n "$win_dir" && test -n "$linux_dir"
          (cd "$win_dir" && zip -q -r "../../release-assets/kyty-${GITHUB_REF_NAME}-windows-x64.zip" .)
          # The Linux job already archived its package, which keeps the executable bits that artifacts drop.
          cp "$linux_dir/kyty-${GITHUB_REF_NAME}-linux-x64.tar.gz" release-assets/

      - name: Create immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # A tag with a prerelease label (v1.2.3-beta.1) publishes a prerelease.
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --verify-tag \
            --title "Kyty ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${prerelease[@]}"
